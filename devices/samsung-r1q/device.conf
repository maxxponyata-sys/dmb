# Samsung Galaxy A80 (SM-A805F), Snapdragon 730G (SM7150-AB)
DEVICE_NAME="Samsung Galaxy A80"
DEVICE_MODEL="SM-A805F"
DEVICE_SOC="sm7150"
DEVICE_KERNEL="sm7150-mainline"
DEVICE_DTB="qcom/sm7150-samsung-r1q"

# The Samsung bootloader takes Image.gz with the DTB appended, like the
# LineageOS Image.gz-dtb, inside an Android boot image header v1.
DEVICE_KERNEL_IMAGE="Image.gz"
DEVICE_DTB_APPEND="true"
DEVICE_BOOTIMG_HEADER_VERSION=1
DEVICE_BOOTIMG_PAGESIZE=4096
DEVICE_BOOTIMG_BASE=0x00000000
DEVICE_BOOTIMG_KERNEL_OFFSET=0x00008000
DEVICE_BOOTIMG_RAMDISK_OFFSET=0x02000000
DEVICE_BOOTIMG_TAGS_OFFSET=0x01e00000
DEVICE_BOOTIMG_SECOND_OFFSET=0x00000000
DEVICE_BOOTIMG_BOARD="SRPSA18B007"
# Same version fields as the LineageOS boot.img this bootloader accepts
DEVICE_BOOTIMG_OS_VERSION="15.0.0"
DEVICE_BOOTIMG_OS_PATCH_LEVEL="2026-06"

DEVICE_CMDLINE="console=tty0 loglevel=7 clk_ignore_unused pd_ignore_unused"
DEVICE_FLASH_METHOD="odin"
# Debian goes on the userdata partition (erases Android data)
DEVICE_ROOT_PARTLABEL="userdata"
# File name the PIT assigns to userdata (Samsung: sparse ext4 = *.img.ext4;
# plain "userdata.img" is rejected by Odin as "Unassigned file")
DEVICE_ODIN_ROOTFS_NAME="userdata.img.ext4"
# Image size only; it grows to the whole partition on first boot
DEVICE_ROOTFS_SIZE="3G"

# Freedreno (Adreno 618): Mesa from Debian; the zap shader comes from the
# phone's own vendor partition (Samsung-signed), see docs/samsung-r1q.md
DEVICE_PACKAGES="kmscube python3-minimal"
