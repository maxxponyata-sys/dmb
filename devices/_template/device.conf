# <Vendor> <Model> (<model number>), <SoC>
# Copy of devices/_template made by ./dmb new-device. See docs/porting.md.
DEVICE_NAME="Vendor Model"
DEVICE_MODEL=""
DEVICE_SOC=""
# Directory name under kernels/
DEVICE_KERNEL=""
# DTB path inside arch/arm64/boot/dts/, without .dtb
DEVICE_DTB="qcom/socname-vendor-codename"

# Boot image: copy these from the stock or LineageOS boot.img
# (unpack_bootimg --boot_img boot.img prints all of them)
DEVICE_KERNEL_IMAGE="Image.gz"
DEVICE_DTB_APPEND="true"
DEVICE_BOOTIMG_HEADER_VERSION=0
DEVICE_BOOTIMG_PAGESIZE=4096
DEVICE_BOOTIMG_BASE=0x00000000
DEVICE_BOOTIMG_KERNEL_OFFSET=0x00008000
DEVICE_BOOTIMG_RAMDISK_OFFSET=0x01000000
DEVICE_BOOTIMG_TAGS_OFFSET=0x00000100
DEVICE_BOOTIMG_SECOND_OFFSET=0x00f00000
DEVICE_BOOTIMG_BOARD=""

DEVICE_CMDLINE="console=tty0 loglevel=7"
# fastboot or odin
DEVICE_FLASH_METHOD="fastboot"
DEVICE_ROOT_PARTLABEL="userdata"
DEVICE_ROOTFS_SIZE="3G"
DEVICE_PACKAGES=""
